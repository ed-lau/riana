name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install riana with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        # GUI tests run in the dedicated 'gui' job (PySide6 + pytest-qt). This
        # matrix has no Qt binding, and pytest-qt would abort the session at
        # configure, so the GUI file is excluded here.
        run: |
          pytest --cov=riana --cov-report=term-missing --cov-report=xml \
            tests --ignore=tests/test_gui.py

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  gui:
    # PySide6 is a [gui] extra (not core); pytest-qt is installed ad-hoc here
    # (test tool, kept out of published extras). The main matrix --ignores
    # tests/test_gui.py and installs neither. This job adds the headless Qt system
    # libs and runs the GUI suite under the offscreen platform, so the
    # Integrate/Model build_config wiring (incl. --iso auto / --fs) is covered
    # without Qt flakiness leaking into the matrix.
    name: GUI (headless Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt headless system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install riana with dev + gui extras (+ pytest-qt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"
          python -m pip install "pytest-qt>=4"

      - name: Run GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui.py -q
