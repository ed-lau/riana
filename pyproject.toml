[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riana"
dynamic = ["version"]
description = "Riana integrates the relative abundance of isotopomers in mass spectrometry data and performs kinetics modeling."
readme = "README.md"
requires-python = ">=3.10,<4"
license = { file = "LICENSE.md" }
authors = [
    { name = "Edward Lau", email = "edward.lau@cuanschutz.edu" }
]
keywords = ["scientific", "turnover", "kinetics", "proteomics", "mass-spectrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pymzml>=2,<3",
    "pyteomics>=4.7",
    "pybaselines>=1.1",
    "scipy>=1",
    "pandas>=2",
    "matplotlib>=3,<4",
    "numpy>=1.24",
    "tqdm>=4,<5",
    "scikit-learn>=1",
    "statsmodels>=0.14",
    "IsoSpecPy>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-qt>=4",
    "pyarrow>=14",
]
# DIA intake (M6b). Reading the DIA-NN report.parquet needs pyarrow; kept
# optional so a DDA-only install stays lightweight (io.diann imports it lazily
# and raises a clear install hint if missing).
dia = [
    "pyarrow>=14",
]
# Qt GUI (M4 Phase 2). Kept optional so the core CLI stays lightweight:
# PySide6 (LGPL) for widgets, qasync to bridge asyncio with the Qt event loop,
# pyqtgraph for fast embedded chromatogram plotting.
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "pyqtgraph>=0.13",
]

[project.scripts]
riana = "riana.cli:main"

[project.urls]
Homepage = "https://ed-lau.github.io/riana/"
Source = "https://github.com/ed-lau/riana"
"Lau Lab" = "https://www.laulab.net"

[tool.setuptools.packages.find]
include = ["riana*"]

[tool.setuptools.package-data]
"riana.data.coefficients" = ["*.csv"]

[tool.setuptools.dynamic]
version = { attr = "riana.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
