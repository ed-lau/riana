[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riana"
dynamic = ["version"]
description = "Riana integrates the relative abundance of isotopomers in mass spectrometry data and performs kinetics modeling."
readme = "README.md"
requires-python = ">=3.10,<4"
license = { file = "LICENSE.md" }
authors = [
    { name = "Edward Lau", email = "edward.lau@cuanschutz.edu" }
]
keywords = ["scientific", "turnover", "kinetics", "proteomics", "mass-spectrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pymzml>=2,<3",
    # pyteomics 5.0 moved mzML CV-term resolution onto `psims`. Verified
    # byte-identical mzML/mzTab parity vs 4.7.5 on 2026-06-24 (sample1 golden
    # within 1e-3; 70/70 io + integration + algorithm tests). Pinned <6 to gate
    # the next major bump the same way 1.0.0 gated <5.
    "pyteomics>=5,<6",
    # lxml (XML parser) and psims (PSI-MS CV resolver) are used *internally* by
    # pyteomics.mzml (riana.io.mzml) but are NOT pulled by a bare `pyteomics`
    # install — only by the `pyteomics[xml]` extra. Declared explicitly so a
    # fresh install can read mzML. psims is the new hard requirement in 5.0 (the
    # reason 1.0.0 pinned pyteomics<5); lxml was the analogous 1.0.0 fix.
    "lxml>=4",
    "psims>=1.3",
    "pybaselines>=1.1",
    "scipy>=1",
    "pandas>=2",
    "matplotlib>=3,<4",
    "numpy>=1.24",
    "tqdm>=4,<5",
    "scikit-learn>=1",
    "statsmodels>=0.14",
    "IsoSpecPy>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    # Process-level test parallelism (`pytest -n auto`). The suite is CPU-bound
    # (IsoSpec, integration, curve_fit) and the heavy fixtures decode large mzML,
    # so distribution across cores is a large CI/local win. Opt-in per invocation
    # (CI test job + tox), not in addopts, so single-file / -x / pdb runs stay serial.
    "pytest-xdist>=3",
    "pyarrow>=14",
    # Static type checking. Scoped to riana/algorithms/ for now ([tool.mypy] below);
    # the CI `typecheck` job runs a bare `mypy` (config-driven). Widen `files` as the
    # rest of the tree is annotated.
    "mypy>=1.11",
]
# DIA intake (M6b). Reading the DIA-NN report.parquet needs pyarrow; kept
# optional so a DDA-only install stays lightweight (io.diann imports it lazily
# and raises a clear install hint if missing).
dia = [
    "pyarrow>=14",
]
# Qt GUI (M4 Phase 2). Kept optional so the core CLI stays lightweight:
# PySide6 (LGPL) for widgets, qasync to bridge asyncio with the Qt event loop,
# pyqtgraph for fast embedded chromatogram plotting.
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "pyqtgraph>=0.13",
]
# Standalone GUI bundle build (packaging/). PyInstaller freezes the CLI+GUI into a
# macOS .app / one-dir bundle so non-Python users can launch `riana gui` — see
# packaging/README.md. Build with the [gui] extra also installed.
packaging = [
    "pyinstaller>=6",
]
# NB: pytest-qt is intentionally in NEITHER [dev] nor [gui]. The plugin aborts
# the whole pytest session at configure when no Qt binding is importable, so it
# must not be installed in the GUI-less main matrix; and it is a test tool, not a
# runtime gui dep, so it does not belong in the end-user [gui] extra. The CI gui
# job installs it ad-hoc (pip install pytest-qt) alongside .[dev,gui].

[project.scripts]
riana = "riana.cli:main"

[project.urls]
Homepage = "https://ed-lau.github.io/riana/"
Source = "https://github.com/ed-lau/riana"
"Lau Lab" = "https://www.laulab.net"

[tool.setuptools.packages.find]
include = ["riana*"]

[tool.setuptools.package-data]
"riana.data.coefficients" = ["*.csv"]
"riana.gui.resources" = ["*.png"]

[tool.setuptools.dynamic]
version = { attr = "riana.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: heavy end-to-end / large-fixture test (big-mzML integration, full pipeline). Skip the slow tier with -m 'not slow' for a fast inner-loop run.",
]

[tool.mypy]
# Typed-code rollout (post-M4 chore). Start `--strict` on the leaf ``algorithms/``
# package — the smallest blast radius — and widen ``files`` outward over time.
# ``follow_imports = "silent"`` reads imported ``riana`` modules for their types but
# reports errors only in ``files``, so the strict gate stays scoped until the rest of
# the tree is annotated.
python_version = "3.10"
files = ["riana/algorithms"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Scientific dependencies that ship no type stubs / ``py.typed`` marker.
module = ["IsoSpecPy.*", "pybaselines.*", "scipy.*"]
ignore_missing_imports = true
