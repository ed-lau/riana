[tox]
envlist = py310, py311, py312
isolated_build = true

[testenv]
deps = pytest
       pytest-cov
       pytest-xdist
commands = pytest -n auto --cov=riana --cov-report=term-missing tests

[testenv:typecheck]
description = mypy --strict (scoped to riana/algorithms/; see [tool.mypy])
deps = mypy>=1.11
commands = mypy
